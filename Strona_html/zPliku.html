<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browary Bilba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css-reset.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Almendra+SC&family=Quintessential&display=swap" rel="stylesheet">
</head>
<body class="end">
    <nav>
        <div class="header">
            <h1>Witaj w Shire!</h1>
        </div>
        <div class="Archive-Button">
            <a href="{{ url_for('archive') }}">
                <img src="{{ url_for('static', filename='Button-Archive.svg') }}" alt="archive button">
            </a>
        </div>
    </nav>

    <main>
        <div class="menu">
            <div class="deska">
                <div class="screw"></div>
                <h2 class="data">Podaj plik txt: (plik musi się znajdować w folderze projektu)</h2>
                <div class="screw"></div>
            </div>

            <div class="wrapper">
                <form id="dataForm" action="{{ url_for('upload_txt') }}" method="post">
                    <input type="text" name="nazwaPliku" placeholder="Nazwa pliku (np. wejscie.txt)" class="text-input" required>
                    <button type="submit" class="accept-button">Akceptuj</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
