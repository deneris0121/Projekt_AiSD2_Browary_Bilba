<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Page - Browary Bilba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css-reset.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Almendra+SC&family=Quintessential&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="header">
            <h1>Witaj w Shire!</h1>
        </div>
        <div class="Archive-Button">
            <a href="{{ url_for('archive') }}">
                <img src="{{ url_for('static', filename='Button-Archive.svg') }}" alt="archive button" href="archive.html">
            </a>
        </div>
    </nav>
    <main id="menuContainer">
        <script>
            const krawedzie = localStorage.getItem("krawedzie");
            const n =  parseInt(krawedzie);
            let current = 0;

            const menu = document.getElementById("menuContainer");

            function renderForm(index) {
                menu.innerHTML = `
            <div class="menu">
                <div class="deska">
                    <div class="screw"></div>
                    <h2 class="data1">Podaj połączenie ${index + 1}:</h2>
                    <div class="screw"></div>
                </div>
                <div class="wrapper">
                    <input type="text" id="xskrzyzowania${index}" name="xskrzyzowania${index}" placeholder="Współrzędna x" class="text-input">
                    <input type="text" id="yskrzyzowania${index}" name="yskrzyzowania${index}" placeholder="Współrzędna y" class="text-input">
                    <input type="text" id="jeczmiens${index}" name="jeczmiens${index}" placeholder="Ilość jęczmienia" class="text-input">
                    <input type="text" id="piwos${index}" name="piwos${index}" placeholder="Ilość piwa" class="text-input">
                    <input type="text" id="naprawas${index}" name="naprawas${index}" placeholder="Koszt naprawy drogi" class="text-input">
                    <button class="accept-button">Dalej</button>
                </div>
            </div>
            `;

            menu.querySelector(".accept-button").addEventListener   ("click", () => {
                const xskrzyzowania = document.getElementById(`xskrzyzowania${index}`).value;
                    const yskrzyzowania = document.getElementById(`yskrzyzowania${index}`).value;
                    const jeczmiens = document.getElementById(`jeczmiens${index}`).value;
                    const piwos = document.getElementById(`piwos${index}`).value;
                    const naprawas = document.getElementById(`naprawas${index}`).value;
                    // Przechowywanie danych w localStorage
                    localStorage.setItem(`xskrzyzowania${index}`, xskrzyzowania);
                    localStorage.setItem(`yskrzyzowania${index}`, yskrzyzowania);
                    localStorage.setItem(`jeczmiens${index}`, jeczmiens);
                    localStorage.setItem(`piwos${index}`,piwos);
                    localStorage.setItem(`naprawas${index}`, naprawas);
               if (current < n - 1) 
                {
                 current++;
                 renderForm(current);
                } 
                else 
                {
                window.location.href = "{{ url_for('output') }}";
                }
                });
            }

            renderForm(current);
        </script>
    </main>
    
</body>
</html>
