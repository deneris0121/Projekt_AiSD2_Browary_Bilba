<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Page - Browary Bilba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css-reset.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Almendra+SC&family=Quintessential&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="header">
            <h1>Witaj w Shire!</h1>
        </div>
        <div class="Archive-Button">
            <a href="{{ url_for('archive') }}">
                <img src="{{ url_for('static', filename='Button-Archive.svg') }}" alt="archive button" href="archive.html">
            </a>
        </div>
    </nav>
    <main id="menuContainer">
        <script>
            const pola = localStorage.getItem("pola");
            const n = parseInt(pola); // Liczba pól (podstron)
            let current = 0;
            const menu = document.getElementById("menuContainer");
        
            const wspolrzedneIlosci = []; // tablica na ilości współrzędnych
        
            function renderForm(index) {
                menu.innerHTML = `
                <div class="menu">
                    <div class="deska">
                        <div class="screw"></div>
                        <h2 class="data1">Podaj dane pola ${index + 1}:</h2>
                        <div class="screw"></div>
                    </div>
                    <div class="wrapper">
                        <input type="number" id="xpole${index}" name="xpole${index}" placeholder="Ilość współrzędnych dla pola" class="text-input">
                        <button class="accept-button">Dalej</button>
                    </div>
                </div>
                `;
        
                menu.querySelector(".accept-button").addEventListener("click", () => {
                    const xpole = document.getElementById(`xpole${index}`).value;
                    

                    // Przechowywanie danych w localStorage
                    localStorage.setItem(`xpole${index}`, xpole);


        
                    if (current < n - 1) {
                        current++;
                        renderForm(current);
                    } else {
                        // Przejście do kolejnej strony (np. input-cwiartki-wspol.html)
                         window.location.href = "{{ url_for('input_pole') }}";
                    }
                });
            }
        
            renderForm(current);
        </script>
    
</body>
</html>
