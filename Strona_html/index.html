<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browary Bilba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css-reset.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Almendra+SC&family=Quintessential&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="header">
            <h1>Witaj w Shire!</h1>
        </div>
        <div class="Archive-Button">
            <a href="{{ url_for('archive') }}">
                <img src="{{ url_for('static', filename='Button-Archive.svg') }}" alt="archive button" href="archive.html">
            </a>
        </div>
    </nav>
    <main>
        <div class="menu">
            <div class="deska">
                <div class="screw"></div>
                <h2 class="data">Wprowadź dane:</h2>
                <div class="screw"></div>
            </div>
            <div class="wrapper">
                <form id="dataForm">
                    <input type="text" name="pola" id="pola" placeholder="Ilość pól" class="text-input">
                    <input type="text" name="browary" id="browary" placeholder="Ilość browarów" class="text-input">
                    <input type="text" name="karczmy" id="karczmy" placeholder="Ilość karczm" class="text-input">
                    <input type="text" name="skrzyzowania" id="skrzyzowania" placeholder="Ilość skrzyżowań" class="text-input">
                    <input type="text" name="krawedzie" id="krawedzie" placeholder="Ilość krawędzi" class="text-input">
                    <button type="submit" class="accept-button">Akceptuj</button>
                </form>
            </div>
        </div>
    </main>
    <script>
        document.getElementById("dataForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // Pobieranie danych z formularza
            const pola = document.getElementById("pola").value;
            const browary = document.getElementById("browary").value;
            const karczmy = document.getElementById("karczmy").value;
            const skrzyzowania = document.getElementById("skrzyzowania").value;
            const krawedzie = document.getElementById("krawedzie").value;

            // Przechowywanie danych w localStorage
            localStorage.setItem("pola", pola);
            localStorage.setItem("browary", browary);
            localStorage.setItem("karczmy", karczmy);
            localStorage.setItem("skrzyzowania", skrzyzowania);
            localStorage.setItem("krawedzie", krawedzie);

            // Przekierowanie na stronę input-pole.html
            window.location.href = "{{ url_for('input_cwiartki') }}";
        });
    </script>
</body>
</html>
