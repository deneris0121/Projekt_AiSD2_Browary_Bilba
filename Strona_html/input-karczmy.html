<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Page - Browary Bilba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css-reset.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Almendra+SC&family=Quintessential&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="header">
            <h1>Witaj w Shire!</h1>
        </div>
        <div class="Archive-Button">
            <a href="{{ url_for('archive') }}">
                <img src="{{ url_for('static', filename='Button-Archive.svg') }}" alt="archive button" href="archive.html">
            </a>
        </div>
    </nav>
    <main id="menuContainer">
        <script>
            const karczmy = localStorage.getItem("karczmy");
            const n =  parseInt(karczmy);
            let current = 0;

            const menu = document.getElementById("menuContainer");

            function renderForm(index) {
            menu.innerHTML = `
            <div class="menu">
                <div class="deska">
                    <div class="screw"></div>
                    <h2 class="data1">Podaj dane karczmy ${index + 1}:</h2>
                    <div class="screw"></div>
                </div>
                <div class="wrapper">
                    <input type="text" id="xkarczmy${index}" name="xkarczmy${index}" placeholder="Współrzędna x" class="text-input">
                    <input type="text" id="ykarczmy${index}" name="ykarczmy${index}" placeholder="Współrzędna y" class="text-input">
                    <input type="text" id="jeczmienk${index}" name="jeczmienk${index}" placeholder="Zapotrzebowanie na piwo" class="text-input">
                    <button class="accept-button">Dalej</button>
                </div>
            </div>
            `;

            menu.querySelector(".accept-button").addEventListener   ("click", () => {
                const xkarczmy = document.getElementById(`xkarczmy${index}`).value;
                    const ykarczmy = document.getElementById(`ykarczmy${index}`).value;
                    const jeczmienk = document.getElementById(`jeczmienk${index}`).value;
                    // Przechowywanie danych w localStorage
                    localStorage.setItem(`xkarczmy${index}`, xkarczmy);
                    localStorage.setItem(`ykarczmy${index}`, ykarczmy);
                    localStorage.setItem(`jeczmienk${index}`, jeczmienk);
                    if(jeczmienk<1){
                        localStorage.setItem("errorMessage", "SARUMAN SPALIŁ CAŁY JECZMIEN");
                        window.location.href =  "{{ url_for('error') }}"; // Możesz zmienić na odpowiednią stronę
                    } else{
                        if (current < n - 1) 
                        {
                            current++;
                            renderForm(current);
                        } 
                        else 
                        {
                            window.location.href = "{{ url_for('input_skrzyzowania') }}";
                        }
                    }
                });
            }

            renderForm(current);
        </script>
    </main>
    
</body>
</html>
