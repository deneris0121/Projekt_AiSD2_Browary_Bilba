<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Page - Browary Bilba</title>
    <link rel="stylesheet" href="css-reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Almendra+SC&family=Quintessential&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="Exit-Button">
            <img src="images/Button-Ezit.svg" alt="exit button" href="end.html">
        </div>
        <div class="header">
            <h1>Witaj w Shire!</h1>
        </div>
        <div class="Archive-Button">
            <img src="images/Button-Archive.svg" alt="archive button" href="archive.html">
        </div>
    </nav>
    <main id="menuContainer">
        <script>
           const n = 4; // Liczba ćwiartek (podstron)
let current = 0;

const menu = document.getElementById("menuContainer");

function renderForm(index) {
    menu.innerHTML = `
        <div class="menu">
            <div class="deska">
                <div class="screw"></div>
                <h2 class="data1">Podaj dane Ćwiartki ${index + 1}:</h2>
                <div class="screw"></div>
            </div>
            <div class="wrapper">
                <input type="text" id="xwierzch${index}" placeholder="Podaj ilość współrzędnych" class="text-input">
                <input type="text" id="jeczmien${index}" placeholder="Ilość jęczmienia" class="text-input">
                <button class="accept-button">Dalej</button>
            </div>
        </div>
    `;

    menuContainer.querySelector(".accept-button").addEventListener("click", () => {
        const xwierzch = document.getElementById(`xwierzch${index}`).value;
        const jeczmien = document.getElementById(`jeczmien${index}`).value;

        // Przechowywanie danych w localStorage
        localStorage.setItem(`xwierzch${index}`, xwierzch);
localStorage.setItem(`jeczmien${index}`, jeczmien);

// Dodanie logów do konsoli
console.log(`xwierzch${index}: ${xwierzch}`);
console.log(`jeczmien${index}: ${jeczmien}`);

        if (current < n - 1) {
            current++;
            renderForm(current);
        } else {
            // Przejście do kolejnej strony (np. input-cwiartki-wspol.html)
            window.location.href = "input-cwiartki-wspol.html";
        }
    });
}

// Uruchomienie renderowania formularzy na podstawie liczby pól
renderForm(current);
    </script>
    
    <div id="menuContainer"></div>
</body>
</html>
